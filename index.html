<script>
const PROMPT={"id":"RB-VSL-Studio-ou-Bali-Teleprompteur","code":"VSL · 8 PHASES","title":"5 clés · Retreat Studio ou Mastermind Bali","subtitle":"VSL Studio ou Bali · PREPARE-ONLY","source":"/Users/lucnerdinaszape/Desktop/Obsidian-Retreat-And-Be-main/02 - Offres/Mastermind Bali/04 - VSL Studio ou Bali - Structure huit phases - 2026-09-09.html","outputHtmlPath":"/Users/lucnerdinaszape/Documents/corpus-rb/mastermind-bali-rb/04-teleprompteur-vsl-studio-ou-bali/RB_VSL_STUDIO_OU_BALI_TELEPROMPTEUR_HORIZONTAL_INTERACTIF_v1.html","sections":[{"label":"Hook et grande promesse","targetSec":75,"blocks":[{"text":"À la fin de cette vidéo, tu repartiras avec cinq clés pour transformer ton idée de retraite en un projet clair, chiffré et prêt à être présenté — même si tu ne sais pas encore par où commencer.","cue":"Voix proposée : Mélanie"},{"text":"Tu vas découvrir comment trouver ce qui rend ton approche singulière, construire une expérience cohérente, poser les bases de ton budget, expliquer ton offre avec les bons mots et préparer sa commercialisation."},{"text":"Si tu es prof de yoga ou praticienne bien-être, tu sais déjà transmettre et accompagner. Mais organiser une retraite soulève d’autres questions : qui viendra, quel programme proposer, quel prix fixer et comment donner envie de te rejoindre ?"},{"text":"Peut-être que ton idée attend dans un carnet. Peut-être que tu as déjà essayé de la lancer, sans obtenir les inscriptions espérées. Ces cinq clés vont t’aider à repérer ce qui manque et à choisir ta prochaine étape."},{"text":"Garde ton projet en tête pendant la vidéo. Pour chaque clé, nous te donnerons une question à te poser et une première action concrète. Et à la fin, nous te montrerons comment aller plus loin selon ton rythme et ta situation."},{"text":"","cue":"NE PAS LIRE · COURTE PRÉSENTATION DE LÉGITIMITÉ À COMPLÉTER : prénom, rôle et expérience concrète en lien avec l’accompagnement ou l’organisation de retraites. Ajouter seulement des faits vérifiés."}]},{"label":"Histoire personnelle et rupture émotionnelle","targetSec":85,"blocks":[{"text":"Sur une retraite à Bali, j’ai perdu 5 000 euros. La retraite était quasiment vide.","cue":"Voix : Lucner"},{"text":"À l’époque, je pensais que le lieu allait vendre. Que Bali, le cadre, la destination allaient donner suffisamment envie aux gens pour qu’ils s’inscrivent. Je comptais sur le lieu pour faire la conversion."},{"text":"Mais entre trouver une destination attirante et réserver une retraite, il y a un pas. Et le lieu, à lui seul, ne l’a pas fait franchir."},{"text":"Le résultat a été concret : une retraite quasi vide et 5 000 euros perdus. C’est cette expérience que je veux partager avec toi, parce qu’on peut facilement accorder beaucoup de place au choix du lieu et laisser les autres questions au second plan."},{"text":"Pourquoi cette retraite ? Pour qui ? Pourquoi venir avec toi ? Qu’est-ce que les participants vont vivre ? Et comment les aider à comprendre l’offre suffisamment pour prendre leur décision ?"},{"text":"La leçon que j’en tire aujourd’hui, c’est qu’un lieu peut donner envie, mais qu’il faut construire tout ce qui permet de passer de cette envie à une inscription."},{"text":"Et c’est là que les cinq clés prennent leur sens : clarifier ton approche, construire l’expérience, travailler ton budget, formuler ton message et préparer ta commercialisation."}]},{"label":"Nouveau mécanisme","targetSec":70,"blocks":[{"text":"Le lieu est une de ces pièces. Un projet de retraite avance quand toutes les pièces commencent à se répondre.","cue":"Voix proposée : Lucner"},{"text":"Le public que tu choisis influence le programme. Le programme influence les moyens nécessaires. Ces moyens influencent ton budget. Et ton message doit permettre aux bonnes personnes de comprendre l’ensemble."},{"text":"Si tu travailles chaque sujet séparément, tu peux passer beaucoup de temps à refaire ce que tu viens de terminer : une page qui ne correspond plus à l’offre, un prix posé avant d’avoir calculé les coûts, du contenu qui attire sans expliquer ce que tu proposes."},{"text":"Les cinq clés suivent cet ordre : ce qui rend ton approche singulière, l’expérience que tu proposes, son budget, les mots pour la présenter et les actions pour la commercialiser."},{"text":"Tu peux déjà les utiliser pour relire ton projet. Si tu bloques sur un prix, reviens au programme et aux coûts. Si tu bloques sur une publication, reviens au public et au message. Tu sauras mieux quelle décision reprendre, au lieu de tout remettre en question."}]},{"label":"Les cinq clés et leurs premières applications","targetSec":140,"blocks":[{"text":"Première clé : ta singularité. À qui veux-tu proposer cette retraite, et quelle place ton approche peut-elle prendre dans sa vie ? Commence par compléter cette phrase : « Cette retraite s’adresse à… qui souhaitent… à travers… » Choisir un public précis t’aide à rendre ton idée compréhensible.","cue":"Clé 1 — Trouver ce qui rend ton approche singulière"},{"text":"Deuxième clé : l’expérience. Que veux-tu faire vivre au groupe pendant ces quelques jours ? Note l’intention de chaque journée, puis les pratiques et les temps libres qui la soutiennent. Si une activité ne sert aucune intention, demande-toi si elle a sa place. Tu commences ainsi à construire un programme avec un fil conducteur.","cue":"Clé 2 — Construire une expérience cohérente"},{"text":"Troisième clé : le budget. Quels coûts devras-tu couvrir, même avec moins d’inscriptions que prévu ? Liste les coûts fixes et ceux qui varient par participant, puis compare plusieurs scénarios d’inscription. Intègre aussi ton temps de travail. Tu pourras examiner ton seuil d’équilibre avant de décider du prix.","cue":"Clé 3 — Poser les bases de ton budget"},{"text":"Quatrième clé : le message. Une personne qui ne te connaît pas comprend-elle ce que tu proposes ? Écris une présentation en trois phrases : pour qui, quelle expérience, quelles modalités essentielles. Fais-la lire à quelqu’un et demande-lui de la reformuler. Tu repéreras les mots qui éclairent ton offre et ceux qui restent flous.","cue":"Clé 4 — Expliquer ton offre avec les bons mots"},{"text":"Cinquième clé : la commercialisation. Comment une personne intéressée passera-t-elle de la découverte à une prochaine étape claire ? Dessine ce parcours : un contenu pour découvrir, une page pour comprendre, un moyen de poser ses questions ou de s’inscrire quand tout est prêt. Puis place la préparation de ces supports et les actions de suivi dans ton calendrier.","cue":"Clé 5 — Préparer ta commercialisation"},{"text":"Tu as maintenant cinq points pour relire ton projet. Repère celui qui reste le plus flou : c’est une première piste pour savoir où concentrer ton travail."}]},{"label":"Transition : comprendre et appliquer","targetSec":61,"blocks":[{"text":"Tu repars donc avec les cinq clés annoncées : ta singularité, ton expérience, ton budget, ton message et ta commercialisation. Tu as aussi une première action pour chacune. Tu peux commencer à les appliquer à ton projet dès maintenant.","cue":"Voix proposée : Mélanie"},{"text":"Parmi tes idées, laquelle approfondir ? Ton programme tient-il dans le temps disponible ? Ton message est-il compréhensible pour quelqu’un qui ne te connaît pas ? Quel chantier traiter cette semaine ?"},{"text":"Tu peux avancer seule si tu disposes du temps et du recul nécessaires. Un accompagnement apporte un cadre de travail, des retours et des rendez-vous pour prendre ces décisions et poursuivre leur mise en œuvre."},{"text":"Et ce cadre peut prendre différentes formes. Certaines personnes ont besoin d’appliquer entre deux séances, de tester et de revenir avec leurs questions. D’autres ont besoin de dégager un temps dédié pour se concentrer sur leur projet."},{"text":"Pour t’aider à mettre ces cinq clés en pratique, nous avons pensé deux cadres d’accompagnement. Regardons à qui chacun peut correspondre."}]},{"label":"Pitch des deux offres et CTA","targetSec":139,"blocks":[{"text":"Pour découvrir le parcours qui pourrait te correspondre, tu peux cliquer sur « Voir quel parcours me correspond » sous cette vidéo. Tu commenceras par quelques questions sur ton activité et ton projet.","cue":"Voix proposée : Lucner, puis Mélanie"},{"text":"Le premier chemin, c’est Retreat Studio. Un accompagnement progressif à distance pour construire ton projet étape par étape : le concept, le public, le programme, l’économie et la préparation de sa commercialisation."},{"text":"Tu avances entre les séances, tu appliques à ta situation et tu reviens avec tes questions. Ce rythme te laisse de la place pour faire mûrir tes décisions tout en poursuivant ton activité. Il peut te convenir si tu veux tester et ajuster au fil du travail."},{"text":"Le deuxième chemin, c’est le Mastermind intensif à Bali. Le format que nous préparons concentre le travail sur neuf jours, avec des temps de pratique, de réflexion, des ateliers professionnels et des échanges en groupe."},{"text":"L’objectif est de travailler ton projet et de produire avec toi ses supports marketing : ton positionnement, ton texte de présentation, une page, une séquence de lancement, un calendrier de contenu, ainsi que des photos et des vidéos selon le périmètre prévu."},{"text":"Des temps individuels et un accompagnement avant, pendant et après l’immersion sont prévus dans le projet. Le détail des livrables et des modalités te sera présenté avant tout engagement."},{"text":"Bali demande de pouvoir dégager cette période et de s’impliquer dans une production concentrée. Retreat Studio permet d’étaler ce travail et les ajustements dans le temps."},{"text":"Pour choisir, nous regarderons où tu en es, ce que tu souhaites construire et tes contraintes. Après lecture de tes réponses au questionnaire, si l’un des parcours semble adapté, nous te proposerons un appel d’orientation. Nous pourrons aussi te recommander de préparer certaines étapes avant de nous rejoindre."}]},{"label":"Urgence, rareté et projection","targetSec":135,"blocks":[{"text":"","cue":"NE PAS LIRE · RARETÉ RÉELLE À COMPLÉTER : capacité validée du parcours concerné, raison opérationnelle de cette limite et date de candidature uniquement si décidée. Forme proposée : « Pour [session confirmée], nous pouvons accompagner [nombre confirmé] personnes, parce que [temps individuel ou moyens de production réellement prévus]. »"},{"text":"Imagine rouvrir ton dossier de retraite et pouvoir retrouver les décisions prises.","cue":"Voix proposée : Mélanie, puis Lucner"},{"text":"Tu sais à qui tu veux t’adresser. Tu peux expliquer l’expérience en quelques phrases. Tu as un programme de travail, un budget avec ses hypothèses et une liste claire des points à vérifier. Quand quelqu’un te demande ce que tu prépares, tu peux lui répondre précisément."},{"text":"Tu n’as pas la certitude de vendre toutes les places. Tu disposes d’une base pour présenter ton projet, écouter les retours et ajuster tes actions."},{"text":"Avec Retreat Studio, tu peux construire cette base progressivement, en laissant à chaque étape le temps d’être appliquée. Avec Bali, l’intention est de consacrer une période à ces décisions et à la production des supports, puis de poursuivre leur déploiement."},{"text":"Attendre peut être une bonne décision si ton activité, ton agenda ou ta situation ne permettent pas de t’engager maintenant. Mais si tu repousses surtout parce que tu ne sais pas quelle étape traiter, ce flou risque de rester le même le mois prochain."},{"text":"Tu peux commencer par faire le point. Qu’as-tu déjà construit ? Qu’est-ce qui bloque ? Quel temps peux-tu consacrer au projet ? Quel type de retour te serait utile ?"},{"text":"Le questionnaire sert à poser ces éléments. Nous cherchons une cohérence entre ton besoin et le travail proposé. Pour Bali, la préparation et la capacité à participer aux ateliers compteront aussi dans cette réflexion."},{"text":"Tu n’as pas besoin d’avoir déjà toutes les réponses. En revanche, tu dois avoir envie de travailler sur ton projet. C’est à partir de là que nous pourrons regarder si l’un des deux cadres peut t’aider à avancer."}]},{"label":"Salve de preuves sociales et invitation finale","targetSec":119,"blocks":[{"text":"","cue":"NE PAS LIRE · INTRODUCTION À ENREGISTRER APRÈS SÉLECTION DES CAS : présenter exactement le travail ou le parcours auquel se rapportent les témoignages."},{"text":"","cue":"NE PAS LIRE · Cas 1 — [Extrait réel autorisé : situation de départ → travail réalisé → changement documenté."},{"text":"","cue":"NE PAS LIRE · Cas 2 — [Même structure, autre difficulté de départ ; choisir parmi les cas disponibles."},{"text":"","cue":"NE PAS LIRE · Cas 3 — [Même structure, autre profil ou autre clé illustrée."},{"text":"","cue":"NE PAS LIRE · Cas 4 — [Extrait réel apportant une preuve complémentaire."},{"text":"","cue":"NE PAS LIRE · Cas 5 — [Extrait réel permettant de conclure sur l’expérience d’accompagnement."},{"text":"","cue":"NE PAS LIRE · Prévoir environ 18 à 20 secondes par extrait, puis la conclusion. Ajouter un sixième cas seulement si le rythme et les matériaux le permettent. Ces emplacements ne constituent pas des témoignages existants : aucun cas vérifié n’est fourni dans les sources consultées."},{"text":"Si tu souhaites faire le point sur ta propre retraite, clique sur « Voir quel parcours me correspond » et réponds aux questions. Nous examinerons ta situation avant de te proposer la suite.","cue":"Voix : personnes témoignant, puis Mélanie ou Lucner"},{"text":"Retreat Studio pour avancer progressivement. Le Mastermind Bali pour concentrer le travail en immersion. Deux chemins pour donner une forme concrète à ce que tu veux transmettre."}]}]};
const LEAD=6,TAIL=6,totalSpoken=PROMPT.sections.reduce((s,x)=>s+x.targetSec,0),total=LEAD+totalSpoken+TAIL;
const scroll=document.getElementById('scroll'),play=document.getElementById('play'),speedLabel=document.getElementById('speed'),sectionLabel=document.getElementById('section');
let elapsed=0,playing=false,last=null,rate=1,fs=46,manualY=null;
const blocks=[];
PROMPT.sections.forEach((section,si)=>section.blocks.forEach(block=>{
  const el=document.createElement('section');el.className='block';el.dataset.section=String(si);
  if(block.cue){const cue=document.createElement('div');cue.className='cue';cue.textContent=block.cue;el.appendChild(cue)}
  const spoken=document.createElement('div');spoken.className='spoken';spoken.textContent=block.text;el.appendChild(spoken);scroll.appendChild(el);blocks.push(el);
}));
function mmssClient(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function maxY(){return Math.max(0,scroll.scrollHeight-window.innerHeight*.345)}
function sectionStartY(index){
  const first=blocks.find(el=>Number(el.dataset.section)===index);
  return first?Math.max(0,Math.min(maxY(),first.offsetTop-window.innerHeight*.345)):0;
}
function timedY(speaking){
  let cursor=0;
  for(let i=0;i<PROMPT.sections.length;i++){
    const duration=PROMPT.sections[i].targetSec;
    if(speaking<=cursor+duration||i===PROMPT.sections.length-1){
      const start=sectionStartY(i);
      const end=i===PROMPT.sections.length-1?maxY():sectionStartY(i+1);
      const ratio=Math.max(0,Math.min(1,(speaking-cursor)/duration));
      return start+(end-start)*ratio;
    }
    cursor+=duration;
  }
  return maxY();
}
function apply(){
  const speaking=Math.max(0,Math.min(totalSpoken,elapsed-LEAD));
  const y=manualY==null?timedY(speaking):manualY;
  scroll.style.transform='translateY('+(-y)+'px)';
  const readAt=window.innerHeight*.345;
  let active=blocks[0],best=Infinity;
  blocks.forEach(el=>{const top=el.offsetTop-y,bottom=top+el.offsetHeight;const d=readAt<top?top-readAt:readAt>bottom?readAt-bottom:0;if(d<best){best=d;active=el}});
  if(active){const activeIndex=blocks.indexOf(active);blocks.forEach((el,index)=>{el.classList.toggle('past',index<activeIndex);el.classList.toggle('future',index>activeIndex);el.classList.toggle('active',index===activeIndex)});const s=PROMPT.sections[Number(active.dataset.section)];sectionLabel.textContent='· '+s.label}
  document.getElementById('progressFill').style.width=(Math.min(1,speaking/totalSpoken)*100)+'%';
  document.getElementById('time').innerHTML=mmssClient(speaking)+' <span>/ '+mmssClient(totalSpoken)+'</span>';
  document.getElementById('lead').classList.toggle('show',elapsed<LEAD);
  document.getElementById('tail').classList.toggle('show',elapsed>=LEAD+totalSpoken);
  const left=LEAD-elapsed;document.getElementById('count').textContent=left>3.2?'PRÊT':left<=.4?'GO':String(Math.ceil(left));
  speedLabel.textContent=Math.round(rate*100)+' %';
}
function tick(t){if(last==null)last=t;const dt=(t-last)/1000;last=t;if(playing){elapsed=Math.min(total,elapsed+dt*rate);manualY=null;if(elapsed>=total){playing=false;play.textContent='▶︎ Lecture'}}apply();requestAnimationFrame(tick)}
function toggle(){playing=!playing;play.textContent=playing?'❚❚ Pause':'▶︎ Lecture'}
function restart(){playing=false;elapsed=0;manualY=null;play.textContent='▶︎ Lecture';apply()}
play.onclick=toggle;document.getElementById('restart').onclick=restart;
document.getElementById('startBtn').onclick=e=>{e.stopPropagation();if(!playing)toggle()};
document.getElementById('lead').onclick=()=>{if(!playing)toggle()};
document.getElementById('slower').onclick=()=>{rate=Math.max(.35,rate-.05);apply()};
document.getElementById('faster').onclick=()=>{rate=Math.min(2,rate+.05);apply()};
document.getElementById('smaller').onclick=()=>{fs=Math.max(28,fs-2);document.documentElement.style.setProperty('--fs',fs+'px');apply()};
document.getElementById('larger').onclick=()=>{fs=Math.min(80,fs+2);document.documentElement.style.setProperty('--fs',fs+'px');apply()};
document.getElementById('mirrorBtn').onclick=()=>document.body.classList.toggle('nomirror');
document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='Enter'&&elapsed<LEAD){e.preventDefault();if(!playing)toggle()}
  else if(e.key==='ArrowUp'){e.preventDefault();rate=Math.min(2,rate+.05)}
  else if(e.key==='ArrowDown'){e.preventDefault();rate=Math.max(.35,rate-.05)}
  else if(e.key==='ArrowRight'){e.preventDefault();elapsed=Math.min(total,elapsed+10);manualY=null}
  else if(e.key==='ArrowLeft'){e.preventDefault();elapsed=Math.max(0,elapsed-10);manualY=null}
  else if(e.key==='+'||e.key==='='){fs=Math.min(80,fs+2);document.documentElement.style.setProperty('--fs',fs+'px')}
  else if(e.key==='-'||e.key==='_'){fs=Math.max(28,fs-2);document.documentElement.style.setProperty('--fs',fs+'px')}
  else if(e.key==='m'||e.key==='M'){document.body.classList.toggle('nomirror')}
  else if(e.key==='r'||e.key==='R'){restart()}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
apply();requestAnimationFrame(tick);
</script>
</body></html>
